# Managed by meshly. Docker inserts its own jumps at the top of the FORWARD
# chain when it starts; afterwards, ask meshly (if it is running) to put its
# rule back on top. Non-blocking, and does nothing when meshly.service is not
# active.
[Service]
ExecStartPost=-/usr/bin/systemctl --no-block try-reload-or-restart meshly.service
