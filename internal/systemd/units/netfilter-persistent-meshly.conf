# Managed by meshly. netfilter-persistent.service loads the saved iptables
# rules with iptables-restore, which removes the rule meshly keeps at the top
# of the iptables INPUT and OUTPUT chains; afterwards, ask meshly (if it is
# running) to put it back. Non-blocking, and does nothing when meshly.service
# is not active.
[Service]
ExecStartPost=-/usr/bin/systemctl --no-block try-reload-or-restart meshly.service
