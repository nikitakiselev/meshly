# Managed by meshly. nftables.service loads the system ruleset, which usually
# begins with "flush ruleset" and so removes the meshly table; afterwards,
# ask meshly (if it is running) to re-apply its table. Non-blocking, and
# does nothing when meshly.service is not active.
[Service]
ExecStartPost=-/usr/bin/systemctl --no-block try-reload-or-restart meshly.service
