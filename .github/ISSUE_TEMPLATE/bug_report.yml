name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities must not be reported here.** Use [private reporting](https://github.com/nikitakiselev/meshly/security/advisories/new) instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. sudo meshly init ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: meshly version
      description: Output of `meshly version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Distribution and kernel
      placeholder: Debian 12, 6.1.0-26-amd64
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: meshly doctor output
      description: Output of `sudo meshly doctor` (it contains no private keys; remove addresses you do not want to share).
      render: text
  - type: textarea
    id: firewall
    attributes:
      label: Firewall
      description: Firewall tooling on the host (nftables config, Docker, ...), if relevant.
