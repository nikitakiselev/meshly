# Independent check of a published release: rebuilds the binaries from the
# tagged source (builds are reproducible), compares them with the released
# SHA256SUMS and verifies the Ed25519 signature with release-key.pub from
# the repository, the same way install.sh does.
name: Verify release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.0.1
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Everything but the rebuild works outside the checkout: Go stamps
      # untracked files there into the binaries (vcs.modified).
      - name: Download release assets
        run: gh release download "$TAG" --dir "$RUNNER_TEMP/released"
      - name: Verify the signature of SHA256SUMS
        working-directory: ${{ runner.temp }}
        run: |
          printf '%s\n' '-----BEGIN PUBLIC KEY-----' "MCowBQYDK2VwAyEA$(cat "$GITHUB_WORKSPACE/release-key.pub")" '-----END PUBLIC KEY-----' > key.pem
          { printf 'meshly-release/1\000'; cat released/SHA256SUMS; } > msg
          openssl base64 -d -A -in released/SHA256SUMS.sig -out sig
          openssl pkeyutl -verify -pubin -inkey key.pem -rawin -in msg -sigfile sig
      - name: Verify the released files against SHA256SUMS
        working-directory: ${{ runner.temp }}/released
        run: sha256sum -c SHA256SUMS
      - name: Rebuild from source and compare
        run: |
          test -z "$(git status --porcelain)"
          make dist VERSION="${TAG#v}" COMMIT="$(git rev-parse --short=12 HEAD)"
          diff -u "$RUNNER_TEMP/released/SHA256SUMS" dist/SHA256SUMS
